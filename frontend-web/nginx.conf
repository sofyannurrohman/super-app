server {
    listen 80;
    server_name localhost;
    client_max_body_size 250M;

    # ── Gzip Compression ──────────────────────────────────────────────────
    # Cloudflare menangani gzip ke browser, tapi ini tetap penting untuk:
    # 1. Efisiensi origin pull (Nginx → Cloudflare edge saat cache miss)
    # 2. Koneksi langsung tanpa Cloudflare
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject;

    # ── SPA index.html — selalu ambil versi terbaru ───────────────────────
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ── Static JS & CSS dengan content hash — cache 1 tahun ──────────────
    # Aman karena Vite menggunakan content hash di nama file (immutable)
    location ~* \.(js|css)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
        # Gunakan .gz pre-built dari vite-plugin-compression2 jika tersedia
        gzip_static on;
    }

    # ── Gambar & font — cache 30 hari ─────────────────────────────────────
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
        expires 30d;
    }

    # ── SPA fallback untuk semua path lain ────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Proxy API requests to the backend service
    location /api/ {
        proxy_pass http://backend:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        client_max_body_size 250M;
        proxy_request_buffering off;
    }

    # Proxy uploads to the backend service with streaming & caching support
    location /uploads/ {
        proxy_pass http://backend:8081/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
