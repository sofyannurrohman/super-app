<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="%VITE_APP_LOGO_URL%">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>%VITE_APP_NAME% — %VITE_APP_TAGLINE%</title>
  <!-- Modern Typography: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
    rel="stylesheet">
</head>

<body class="font-jakarta">
  <div id="app">
    <!-- Instant Fallback Skeleton: Replaced immediately when Vue mounts -->
    <div id="app-initial-loader" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fafbfc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;z-index:999999;">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
        <img src="%VITE_APP_LOGO_URL%" alt="Logo" style="width:48px;height:48px;object-fit:contain;" onerror="this.style.display='none'">
        <span style="font-size:22px;font-weight:900;color:#0f172a;letter-spacing:-0.5px;">%VITE_APP_NAME%</span>
      </div>
      <div style="width:36px;height:36px;border:3px solid #e2e8f0;border-top-color:#0d9488;border-radius:50%;animation:initial-spin 0.8s linear infinite;margin-bottom:16px;"></div>
      <p style="font-size:13px;font-weight:600;color:#64748b;margin:0;">Memuat aplikasi...</p>
      <div id="app-loader-stuck" style="display:none;margin-top:20px;text-align:center;">
        <p style="font-size:12px;color:#ef4444;margin:0 0 10px 0;">Memuat memerlukan waktu lebih lama dari biasanya.</p>
        <button onclick="localStorage.clear();sessionStorage.clear();window.location.reload(true);" style="padding:8px 16px;background:#0f172a;color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:bold;cursor:pointer;">
          Segarkan &amp; Bersihkan Cache
        </button>
      </div>
      <style>
        @keyframes initial-spin { to { transform: rotate(360deg); } }
      </style>
      <script>
        setTimeout(function() {
          var el = document.getElementById('app-loader-stuck');
          if (el && document.getElementById('app-initial-loader')) {
            el.style.display = 'block';
          }
        }, 5000);
      </script>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
